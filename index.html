<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#071419">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="تتبع التحركات">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="/icon-192.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<title>تتبع التحركات</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{
  background:#071419;
  font-family:'Segoe UI',Tahoma,Verdana,sans-serif;
  position:fixed;inset:0;
  user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;touch-action:none;
}
#map{position:fixed;inset:0;width:100vw;height:100vh;background:#071419;z-index:1}

/* خريطة ليلية أخف وأكثر وضوحاً */
.leaflet-container{background:#071419}
.leaflet-tile{
  filter:brightness(.72) contrast(1.12) saturate(1.18) hue-rotate(5deg);
}

/* مؤشر التسجيل */
.tracking-indicator{
  position:fixed;
  top:calc(18px + env(safe-area-inset-top));
  right:18px;width:13px;height:13px;border-radius:50%;
  background:rgba(255,255,255,.28);
  border:2px solid rgba(255,255,255,.5);
  z-index:1500;transition:.3s;
}
.tracking-indicator.active{
  background:#00ff88;border-color:#00ff88;
  box-shadow:0 0 0 4px rgba(0,255,136,.18),0 0 20px rgba(0,255,136,.7);
  animation:pulse 1.4s infinite;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}

/* زر التسجيل */
.record-button{
  position:fixed;left:50%;
  bottom:calc(24px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  width:76px;height:76px;padding:0;border:0;border-radius:50%;
  background:rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;
  z-index:2000;cursor:pointer;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  box-shadow:0 8px 30px rgba(0,0,0,.5),0 0 0 2px rgba(255,255,255,.92),0 0 0 5px rgba(0,0,0,.3);
  transition:transform .18s,box-shadow .25s;
}
.record-button::before{
  content:"";position:absolute;width:60px;height:60px;border-radius:50%;
  background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);
}
.record-icon{
  position:relative;z-index:2;width:44px;height:44px;border-radius:50%;
  background:#ff3040;box-shadow:0 2px 10px rgba(255,48,64,.45);
  transition:.22s;
}
.record-button:active{transform:translateX(-50%) scale(.92)}
.record-button.recording{
  box-shadow:0 8px 35px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.95),
  0 0 0 5px rgba(255,48,64,.28),0 0 30px rgba(255,48,64,.45);
  animation:recordGlow 1.6s infinite;
}
@keyframes recordGlow{
  0%,100%{box-shadow:0 8px 35px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.95),0 0 0 5px rgba(255,48,64,.25),0 0 20px rgba(255,48,64,.35)}
  50%{box-shadow:0 8px 35px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.95),0 0 0 8px rgba(255,48,64,.15),0 0 35px rgba(255,48,64,.6)}
}
.record-button.recording .record-icon{
  width:24px;height:24px;border-radius:6px;transform:scale(1.05)
}

/* رسالة الموقع */
.location-message{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(calc(100% - 40px),390px);padding:28px 24px;
  background:rgba(5,13,17,.97);border:1px solid rgba(0,217,255,.3);
  border-radius:24px;box-shadow:0 25px 80px rgba(0,0,0,.75),0 0 40px rgba(0,217,255,.08);
  z-index:5000;text-align:center;display:none;
}
.location-message.show{display:block}
.location-icon{font-size:44px;margin-bottom:14px}
.location-title{color:#fff;font-size:20px;font-weight:700;margin-bottom:10px}
.location-text{color:#9aaeb3;font-size:14px;line-height:1.8;margin-bottom:20px}
.location-button{
  border:0;padding:12px 28px;border-radius:30px;
  background:linear-gradient(135deg,#00e5ff,#00aeca);
  color:#001014;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer
}
.location-button:disabled{opacity:.6}

.leaflet-control-zoom{
  border:0!important;box-shadow:0 5px 20px rgba(0,0,0,.35)!important;
  margin:calc(18px + env(safe-area-inset-top)) 12px 0 0!important
}
.leaflet-control-zoom a{
  background:rgba(5,22,28,.86)!important;color:#00d9ff!important;
  border-color:rgba(0,217,255,.22)!important
}
.leaflet-control-attribution{
  background:rgba(0,8,12,.55)!important;color:rgba(210,235,240,.7)!important;
  font-size:9px!important;border-radius:6px!important
}
.leaflet-control-attribution a{color:#00d9ff!important}
.tracked-area,.current-location-dot{pointer-events:none}

@media(max-width:600px){
  .tracking-indicator{top:calc(16px + env(safe-area-inset-top));right:16px}
}
</style>
</head>

<body>
<div id="map"></div>
<div class="tracking-indicator" id="trackingIndicator"></div>

<div class="location-message" id="locationMessage">
  <div class="location-icon">📍</div>
  <div class="location-title" id="locationTitle">السماح بالوصول إلى الموقع</div>
  <div class="location-text" id="locationText">نحتاج إلى الوصول إلى موقعك حتى نتمكن من تتبع تحركاتك على الخريطة.</div>
  <button class="location-button" id="locationButton" onclick="requestLocation()">السماح بالموقع</button>
</div>

<button class="record-button" id="recordButton" aria-label="التسجيل" onclick="toggleTracking()">
  <span class="record-icon"></span>
</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let map=null,watchId=null,isTracking=false,firstLocationReceived=false;
let routePoints=[],trackedArea=null,currentLocationMarker=null,lastRoutePoint=null;

const recordButton=document.getElementById("recordButton");
const trackingIndicator=document.getElementById("trackingIndicator");
const locationMessage=document.getElementById("locationMessage");
const locationTitle=document.getElementById("locationTitle");
const locationText=document.getElementById("locationText");
const locationButton=document.getElementById("locationButton");

function initMap(lat=25.2048,lng=55.2708){
  if(map!==null)return;
  map=L.map("map",{zoomControl:true,attributionControl:true,zoomAnimation:true,fadeAnimation:true}).setView([lat,lng],15);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom:19
  }).addTo(map);
  setTimeout(()=>map.invalidateSize(),300);
}

function showLocationMessage(title,text,buttonText="حاول مرة أخرى"){
  locationTitle.textContent=title;
  locationText.textContent=text;
  locationButton.textContent=buttonText;
  locationMessage.classList.add("show");
}
function hideLocationMessage(){locationMessage.classList.remove("show")}

function requestLocation(){
  if(!navigator.geolocation){
    showLocationMessage("المتصفح لا يدعم الموقع","المتصفح الحالي لا يدعم تحديد الموقع.","حسنًا");return;
  }
  const secure=window.isSecureContext||location.hostname==="localhost"||location.hostname==="127.0.0.1";
  if(!secure){
    showLocationMessage("الاتصال غير آمن","تحديد الموقع يحتاج إلى HTTPS. افتح الموقع من رابط HTTPS.","فهمت");return;
  }
  locationButton.disabled=true;locationButton.textContent="جاري تحديد الموقع...";
  navigator.geolocation.getCurrentPosition(position=>{
    const {latitude:lat,longitude:lng}=position.coords;
    initMap(lat,lng);map.setView([lat,lng],17);updateCurrentLocation(lat,lng);
    hideLocationMessage();locationButton.disabled=false;locationButton.textContent="حاول مرة أخرى";
  },error=>{
    locationButton.disabled=false;locationButton.textContent="حاول مرة أخرى";handleLocationError(error);
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}

function handleLocationError(error){
  if(error.code===1)showLocationMessage("تم رفض الوصول للموقع","فعّل صلاحية الموقع للمتصفح من إعدادات الهاتف ثم حاول مرة أخرى.");
  else if(error.code===2)showLocationMessage("الموقع غير متاح","تأكد من تشغيل خدمات الموقع وGPS ثم حاول مرة أخرى.");
  else if(error.code===3)showLocationMessage("انتهت مهلة تحديد الموقع","حاول مرة أخرى في مكان مفتوح.");
  else showLocationMessage("تعذر تحديد الموقع","حدث خطأ أثناء الحصول على موقعك.");
}

function toggleTracking(){isTracking?stopTracking():startTracking()}

function startTracking(){
  if(isTracking)return;
  if(!navigator.geolocation){showLocationMessage("الموقع غير مدعوم","المتصفح لا يدعم تحديد الموقع.","حسنًا");return}
  if(map===null)initMap();
  const secure=window.isSecureContext||location.hostname==="localhost"||location.hostname==="127.0.0.1";
  if(!secure){showLocationMessage("الاتصال غير آمن","يجب تشغيل الموقع عبر HTTPS حتى يعمل تتبع الموقع.","فهمت");return}

  isTracking=true;firstLocationReceived=false;routePoints=[];lastRoutePoint=null;
  if(trackedArea){map.removeLayer(trackedArea);trackedArea=null}
  recordButton.classList.add("recording");
  trackingIndicator.classList.add("active");

  watchId=navigator.geolocation.watchPosition(position=>{
    const {latitude:lat,longitude:lng}=position.coords;
    updateCurrentLocation(lat,lng);
    addRoutePoint(lat,lng);
    if(!firstLocationReceived){
      map.setView([lat,lng],17);
      firstLocationReceived=true;
    }
  },handleTrackingError,{enableHighAccuracy:true,timeout:15000,maximumAge:2000});
}

function updateCurrentLocation(lat,lng){
  const p=[lat,lng];
  if(!currentLocationMarker){
    currentLocationMarker=L.circleMarker(p,{
      radius:8,color:"#fff",weight:3,fillColor:"#00d9ff",
      fillOpacity:1,interactive:false,className:"current-location-dot"
    }).addTo(map);
  }else currentLocationMarker.setLatLng(p);
}

function addRoutePoint(lat,lng){
  const p=[lat,lng];
  if(!lastRoutePoint){
    routePoints.push(p);lastRoutePoint=p;createTrackedArea();return;
  }
  if(map.distance(lastRoutePoint,p)<3)return;
  routePoints.push(p);lastRoutePoint=p;updateTrackedArea();
}

function createTrackedArea(){
  if(!map||!routePoints.length)return;
  trackedArea=L.polyline(routePoints,{
    className:"tracked-area",color:"#00d9ff",weight:32,opacity:.30,
    lineCap:"round",lineJoin:"round",interactive:false
  }).addTo(map);
}
function updateTrackedArea(){
  if(trackedArea&&routePoints.length)trackedArea.setLatLngs(routePoints);
}

function handleTrackingError(error){
  if(error.code===1){
    stopTracking();
    showLocationMessage("تم رفض صلاحية الموقع","فعّل صلاحية الموقع للمتصفح من إعدادات الهاتف ثم اضغط زر التسجيل مرة أخرى.");
  }
}

function stopTracking(){
  if(!isTracking)return;
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}
  isTracking=false;recordButton.classList.remove("recording");
  trackingIndicator.classList.remove("active");
}

window.addEventListener("load",()=>{
  initMap();
  if(navigator.geolocation)requestLocation();
  else showLocationMessage("الموقع غير مدعوم","المتصفح الحالي لا يدعم تحديد الموقع.","حسنًا");
});
window.addEventListener("resize",()=>{if(map)map.invalidateSize()});

/* تسجيل Service Worker لتثبيت الموقع كتطبيق */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./service-worker.js").catch(console.error);
  });
}

/* تجهيز نافذة التثبيت عندما يدعمها المتصفح.
   لا نضيف زرًا حتى تبقى الخريطة نظيفة؛ يمكن التثبيت من قائمة المتصفح. */
let deferredInstallPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();
  deferredInstallPrompt=e;
});
</script>
</body>
</html>
